<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>代办事项应用</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>📝 我的代办事项</h1>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="输入一个待办事项..."
          maxlength="120"
          required
        />
        <button type="submit">添加</button>
      </form>

      <section class="toolbar">
        <div class="filters" role="group" aria-label="筛选任务">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="active">未完成</button>
          <button class="filter-btn" data-filter="completed">已完成</button>
        </div>
        <button id="clear-completed" class="ghost">清除已完成</button>
      </section>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="footer">
        <span id="items-left">0 项未完成</span>
      </footer>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input type="checkbox" class="toggle" />
          <span class="text"></span>
        </label>
        <button class="delete" aria-label="删除">删除</button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
